<!-- TAB 3: UNIFIED MULTI-METRIC TREND GRAPH & HABIT LOGGER          -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<div id="tab-panel-log" class="hidden space-y-4">
    
    <div class="bg-[#1a202c] p-5 rounded-2xl border-2 border-dashed border-gray-700 space-y-5">
        
        <!-- Section Header & Graph Legend -->
        <div class="space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-sm font-bold text-gray-100 font-mono flex items-center gap-2">
                    <span>📈</span> Multi-Metric Trend Telemetry
                </span>
                <span class="text-[10px] font-mono text-gray-500">Live Render</span>
            </div>
            
            <!-- Unified Line Graph Legend -->
            <div class="flex flex-wrap items-center gap-3 text-[11px] font-mono pt-1">
                <span class="flex items-center gap-1.5 font-bold text-yellow-400">
                    <span class="w-3 h-1 bg-yellow-400 rounded-full"></span> Weight (<span class="unit-label">kg</span>)
                </span>
                <span class="flex items-center gap-1.5 font-bold text-blue-400">
                    <span class="w-3 h-1 bg-blue-400 rounded-full"></span> Water (L)
                </span>
                <span class="flex items-center gap-1.5 font-bold text-green-400">
                    <span class="w-3 h-1 bg-green-400 rounded-full"></span> Steps (k)
                </span>
                <span class="flex items-center gap-1.5 font-bold text-green-300">
                    <span class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_4px_#2ecc71]"></span> Workout Done
                </span>
            </div>
        </div>

        <!-- Unified Interactive Line Graph Canvas -->
        <div class="bg-[#111827] p-3 rounded-xl border border-gray-800 relative">
            <div id="graph-container" class="w-full h-56 flex items-center justify-center relative overflow-hidden">
                <canvas id="multi-metric-canvas" class="w-full h-full"></canvas>
            </div>
        </div>

        <!-- Fast Habit Logger Inputs -->
        <div class="pt-2 border-t border-gray-800 space-y-3 font-mono text-xs">
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">
                Quick Metric Entry (Today)
            </span>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="block text-gray-400 font-bold">Morning Weight (<span class="unit-label">kg</span>)</label>
                    <input type="number" step="0.1" id="log-weight" placeholder="e.g. 134.2" class="w-full h-10 bg-[#111827] border border-gray-700 text-gray-200 rounded-lg px-3 focus:border-yellow-500 focus:outline-none">
                </div>
                <div class="space-y-1">
                    <label class="block text-gray-400 font-bold">Steps (Goal: 8,000)</label>
                    <input type="number" step="100" id="log-steps" placeholder="e.g. 8500" class="w-full h-10 bg-[#111827] border border-gray-700 text-gray-200 rounded-lg px-3 focus:border-yellow-500 focus:outline-none">
                </div>
            </div>

            <!-- Water Tracker -->
            <div class="p-2.5 bg-[#111827] rounded-xl border border-gray-800 flex items-center justify-between">
                <div>
                    <span class="text-gray-400 text-[10px] block">Water Intake</span>
                    <span id="water-display" class="text-blue-400 font-bold text-sm">0.0 / 3.5 L</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <button id="btn-add-water" class="h-9 px-3 bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 font-bold rounded-lg border border-blue-500/40 text-xs active:scale-95">
                        + 250ml 💧
                    </button>
                    <button id="btn-reset-water" class="h-9 px-2.5 bg-gray-800 hover:bg-gray-700 text-gray-400 rounded-lg border border-gray-700 text-xs">
                        ↺
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between gap-2 pt-1">
                <label class="flex items-center gap-2 text-gray-300 cursor-pointer">
                    <input type="checkbox" id="log-workout-done" class="rounded bg-gray-800 border-gray-700 text-yellow-500">
                    <span>Workout Done Today</span>
                </label>
                <button id="btn-save-log" class="px-5 py-2.5 bg-yellow-500 hover:bg-yellow-400 text-[#1f2937] font-bold rounded-lg transition-all shadow-md active:scale-95 text-xs">
                    + Save & Plot
                </button>
            </div>
        </div>

        <!-- Recent Table Fallback / Delete -->
        <div class="space-y-2 pt-2 border-t border-gray-800">
            <span class="text-[10px] font-mono font-bold text-gray-400 uppercase tracking-wider block">
                Recent Log Records
            </span>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs font-mono border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-[11px]">
                            <th class="pb-1.5">Date</th>
                            <th class="pb-1.5">Weight</th>
                            <th class="pb-1.5">Water</th>
                            <th class="pb-1.5">Steps</th>
                            <th class="pb-1.5 text-center">Workout</th>
                            <th class="pb-1.5 text-center">Del</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>
