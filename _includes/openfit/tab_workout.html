<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- TAB 1: ACTIVE WORKOUT INTERFACE (FRONT & SIDE VIEW LED BOARD)   -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<div id="tab-panel-workout" class="space-y-4">
    
    <div class="bg-[#1a202c] p-4 sm:p-5 rounded-2xl border-2 border-yellow-500/80 shadow-xl space-y-4">
        
        <!-- Active Day & Exercise Header -->
        <div class="space-y-1.5 border-b border-gray-800 pb-3">
            <div class="flex justify-between items-center gap-2">
                <div class="flex items-center gap-2">
                    <span id="active-day-badge" class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 uppercase">Day 1</span>
                    <span id="active-ex-stepper" class="text-xs text-gray-400 font-mono">Exercise 1 of 6</span>
                </div>
                <!-- Rest Timer Pill -->
                <div class="flex items-center gap-1.5 bg-[#111827] px-2.5 py-1.5 rounded-xl border border-gray-700 font-mono text-xs shrink-0">
                    <span class="text-gray-400 text-[10px]">⏱️</span>
                    <span id="rest-timer-display" class="text-sm font-bold text-green-400 min-w-[42px] text-right">01:30</span>
                    <button id="btn-timer-toggle" class="ml-1 px-2 py-0.5 bg-gray-800 hover:bg-gray-700 text-yellow-400 text-[10px] font-bold rounded">Start</button>
                    <button id="btn-timer-reset" class="px-1.5 py-0.5 bg-gray-800 hover:bg-gray-700 text-gray-400 text-[10px] rounded">↺</button>
                </div>
            </div>
            <h2 id="active-ex-title" class="text-lg md:text-xl font-bold text-gray-100 font-mono">
                Loading Protocol...
            </h2>
            <div class="flex items-center gap-2 flex-wrap pt-0.5">
                <span id="active-ex-jis" class="px-2 py-0.5 rounded bg-green-500/15 text-green-400 border border-green-500/30 text-[10px] font-mono font-bold">
                    JIS 1 • Joint Safe
                </span>
                <span id="active-ex-muscles" class="text-[10px] font-mono text-gray-400"></span>
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════════════════════ -->
        <!-- RETRO-FIT ANIMATED LED DISPLAY BOARD (FRONT + SIDE VIEW)        -->
        <!-- ═══════════════════════════════════════════════════════════════ -->
        <div class="rounded-2xl p-1 bg-[#0b0d11] border-2 border-gray-800 shadow-2xl relative overflow-hidden">
            <div id="led-board-container" class="w-full relative">
                <!-- Procedural Front & Side Animated LED Matrix SVG inserted by JS -->
            </div>
            
            <!-- Edge-to-Edge Scrolling LED Ticker (How-To Form Cue) -->
            <div class="border-t border-gray-800 bg-[#08090d] py-2 overflow-hidden relative select-none">
                <div class="led-marquee-track text-[11px] sm:text-xs font-mono font-bold text-yellow-400 uppercase tracking-widest">
                    <span id="ex-ticker-text-1" class="px-3"></span>
                    <span id="ex-ticker-text-2" class="px-3" aria-hidden="true"></span>
                </div>
            </div>
        </div>

        <!-- Set-by-Set Telemetry & Volume Logger Panel -->
        <div class="space-y-3 font-mono pt-1">
            <!-- Panel Header & Target Set Adjuster -->
            <div class="flex justify-between items-center flex-wrap gap-2 bg-[#111827] p-3 rounded-xl border border-gray-800">
                <div>
                    <span class="text-xs font-bold text-gray-200 block">Set-by-Set Logger & Telemetry</span>
                    <span id="active-ex-volume" class="text-[10px] text-yellow-400 font-bold block mt-0.5">3 sets × 10–12 reps</span>
                </div>
                <div class="flex items-center gap-1.5 bg-[#0d1117] px-2 py-1 rounded-lg border border-gray-800">
                    <span class="text-[10px] text-gray-400 font-bold">Target Sets:</span>
                    <button type="button" id="btn-dec-sets" class="w-6 h-6 rounded bg-gray-800 hover:bg-gray-700 text-yellow-400 font-bold flex items-center justify-center text-xs active:scale-95">−</button>
                    <span id="active-set-count-display" class="font-bold text-xs text-gray-100 px-1">3</span>
                    <button type="button" id="btn-inc-sets" class="w-6 h-6 rounded bg-gray-800 hover:bg-gray-700 text-yellow-400 font-bold flex items-center justify-center text-xs active:scale-95">+</button>
                </div>
            </div>

            <!-- Set Cards Grid (Populated Dynamically by JS) -->
            <div id="set-cards-container" class="space-y-2.5">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Thumb-Friendly Navigation Action Bar -->
        <div class="grid grid-cols-2 gap-3 pt-2">
            <button id="btn-prev-ex" class="h-11 bg-gray-800 hover:bg-gray-700 text-gray-200 font-bold font-mono text-xs rounded-xl transition-all border border-gray-700 active:scale-95 flex items-center justify-center gap-1">
                &larr; Prev
            </button>
            <button id="btn-next-ex" class="h-11 bg-yellow-500 hover:bg-yellow-400 text-[#1f2937] font-bold font-mono text-xs rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-1">
                Next Exercise &rarr;
            </button>
        </div>

    </div>

</div>
