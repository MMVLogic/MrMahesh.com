<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} // MrMahesh.com</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <meta name="author" content="Mahesh">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="{{ page.title }} // MrMahesh.com">
    <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MrMahesh.com">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page.title }} // MrMahesh.com">
    <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

    <!-- Fonts (preconnect + non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/assets/main.css">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    {% feed_meta %}
</head>
<body class="bg-[#1f2937] text-gray-100 flex items-center justify-center min-h-screen p-4 scanlines">
    <div class="relative w-full max-w-4xl bg-[#2c3e50] p-6 md:p-10 shadow-lg rounded-2xl border-4 border-dashed border-gray-400 border-animation overflow-hidden">
        
        <!-- Window Chrome -->
        <header class="flex items-center space-x-2 pb-4">
            <div class="w-3 h-3 bg-red-500 rounded-full"></div>
            <div class="w-3 h-3 bg-yellow-400 rounded-full"></div>
            <div class="w-3 h-3 bg-green-500 rounded-full"></div>
            <span class="flex-grow text-center text-sm text-gray-400 select-none">MrMahesh.com // Welcome [FOCUS: HOMELAB]</span>
        </header>

        <!-- Navigation -->
        <nav class="bg-[#1a202c] p-4 rounded-xl border-2 border-dashed border-[#3498db] mb-8" aria-label="Main navigation">
            <p class="text-lg font-bold text-gray-200 mb-2 flex items-center">
                <span class="mr-2 text-[#2ecc71] text-xl">📂</span> &gt; NAVIGATION_
            </p>
            <div class="flex flex-wrap gap-3">
                <a href="/" class="inline-block px-4 py-2 rounded-full border-2 border-[#3498db] text-[#3498db] hover:bg-[#3498db] hover:text-[#1f2937] transition-all duration-300 shadow-md">
                    <span class="font-bold">Home</span>
                </a>
                <a href="/projects/" class="inline-block px-4 py-2 rounded-full border-2 border-[#2ecc71] text-[#2ecc71] hover:bg-[#2ecc71] hover:text-[#1f2937] transition-all duration-300 shadow-md">
                    <span class="font-bold">Projects</span>
                </a>
                <a href="/about/" class="inline-block px-4 py-2 rounded-full border-2 border-[#e74c3c] text-[#e74c3c] hover:bg-[#e74c3c] hover:text-[#1f2937] transition-all duration-300 shadow-md">
                    <span class="font-bold">About</span>
                </a>
                <a href="/apps/" class="inline-block px-4 py-2 rounded-full border-2 border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-[#1f2937] transition-all duration-300 shadow-md">
                    <span class="font-bold">Apps</span>
                </a>
                <a href="/learnwithme/" class="inline-block px-4 py-2 rounded-full border-2 border-pink-500 text-pink-500 hover:bg-pink-500 hover:text-[#1f2937] transition-all duration-300 shadow-md">
                    <span class="font-bold">Learn</span>
                </a>
                <a href="/recipes/" class="inline-block px-4 py-2 rounded-full border-2 border-orange-500 text-orange-500 hover:bg-orange-500 hover:text-[#1f2937] transition-all duration-300 shadow-md">
                    <span class="font-bold">Recipes</span>
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <main>
            {{ content }}
        </main>

        <!-- Footer -->
        <footer class="text-center mt-8 pt-4 border-t border-dashed border-gray-600">
            <p class="text-sm text-gray-500">
                // System check complete // <span class="text-[#2ecc71]">CONNECTION: SECURE</span>
            </p>
            <p class="text-xs text-gray-600 mt-1">
                <span id="copyright-text">&copy; {{ "now" | date: "%Y" }} MrMahesh. All rights reserved.</span>
            </p>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const heading = document.getElementById('main-heading');
            const textToType = "MrMahesh.com";

            function typeWriter() {
                let i = 0;
                heading.textContent = ''; // Clear for animation
                heading.classList.add('typing-effect');

                function type() {
                    if (i < textToType.length) {
                        heading.textContent += textToType.charAt(i);
                        i++;
                        setTimeout(type, 120);
                    } else {
                        heading.classList.remove('typing-effect');
                    }
                }
                type();
            }

            if (heading) {
                typeWriter();
            }

            // Initialize SimpleJekyllSearch
            if (document.getElementById('search-input')) {
                SimpleJekyllSearch({
                    searchInput: document.getElementById('search-input'),
                    resultsContainer: document.getElementById('results-container'),
                    json: '/search.json',
                    searchResultTemplate: '<div class="p-4 mb-2 bg-[#1f2937] rounded-lg border border-gray-700"><a href="{url}" class="text-[#3498db] font-bold text-lg">{title}</a><p class="text-gray-400 text-sm mt-1">{date}</p></div>',
                    noResultsText: '<p class="text-gray-400">No results found.</p>',
                    limit: 10,
                    fuzzy: false
                });
            }
        });
    </script>
</body>
</html>
