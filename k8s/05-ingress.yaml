apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mrmahesh-cms-ingress
  namespace: media
  labels:
    app: mrmahesh-cms
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: cms.mrmahesh.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mrmahesh-cms-service
                port:
                  number: 80
  tls:
    - hosts:
        - cms.mrmahesh.com
      secretName: mrmahesh-wildcard-tls
