---
layout: default
title: Learn With Me
permalink: /learnwithme/
---

<style>
    /* Card Animation Styles */
    .swipe-card {
        transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        will-change: transform, opacity;
    }
    .swipe-card.dragging {
        transition: none; /* Disable transition during drag */
    }
    .swipe-card.swipe-left {
        transform: translate(-150vw, 50px) rotate(-30deg) !important;
        opacity: 0;
    }
        .swipe-card.swipe-down {
        transform: translate(0, 150vh) rotate(0deg) !important;
        opacity: 0;
    }
    .swipe-card.swipe-right {
        transform: translate(150vw, 50px) rotate(30deg) !important;
        opacity: 0;
    }
    .swipe-card.snap-back {
        transform: translate(0, 0) rotate(0deg) !important;
        opacity: 1;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-out; /* Bouncy snap back */
    }
    .perspective-1000 {
        perspective: 1000px;
    }
</style>

<div class="min-h-screen flex flex-col items-center justify-center p-4 overflow-hidden" style="background-color: #1f2937;">
    <!-- Header -->
    <div class="mb-12 text-center z-10">
        <h1 class="text-4xl font-extrabold text-white tracking-tight mb-2">Learn</h1>
        <p class="text-gray-400">Swipe right to like, left to skip. <strong>Swipe Down to Reset Deck.</strong></p>
    </div>

    <!-- Deck Container -->
    <div class="relative w-full max-w-sm h-96 perspective-1000 z-10">
        <!-- Active Card -->
        <div id="active-card" class="swipe-card absolute inset-0 w-full h-full rounded-3xl shadow-2xl flex flex-col p-8 cursor-grab touch-none border border-gray-700/50" style="background-color: #2c3e50;">
            <div class="flex-grow flex flex-col justify-center select-none pointer-events-none">
                <h2 id="card-title" class="text-3xl font-bold text-white mb-4 leading-tight line-clamp-3">Loading...</h2>
                <p id="card-excerpt" class="text-gray-300 text-lg leading-relaxed line-clamp-4 overflow-hidden mb-6">Please wait while we prepare your content.</p>
            </div>
            <div class="mt-auto">
                <a id="card-link" href="#" class="block w-full py-3 px-4 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold text-center rounded-xl transition-colors duration-200 shadow-lg hover:shadow-xl">
                    Read More
                </a>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="flex gap-8 mt-12 z-10">
        <button id="btn-swipe-left" class="w-16 h-16 rounded-full border-2 border-red-500 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all duration-200 shadow-lg focus:outline-none focus:ring-4 focus:ring-red-500/30" style="background-color: #2c3e50;" aria-label="Swipe Left">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <button id="btn-swipe-right" class="w-16 h-16 rounded-full border-2 border-green-500 text-green-500 flex items-center justify-center hover:bg-green-500 hover:text-white transition-all duration-200 shadow-lg focus:outline-none focus:ring-4 focus:ring-green-500/30" style="background-color: #2c3e50;" aria-label="Swipe Right">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
        </button>
    </div>
    
    <!-- End of Deck Message -->
    <div id="end-message" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-0">
        <div class="w-24 h-24 bg-gray-800 rounded-full flex items-center justify-center mb-6 border border-gray-700" style="background-color: #2c3e50;">
            <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h3 class="text-2xl font-bold text-white mb-2">You're all caught up!</h3>
        <p class="text-gray-400">You've seen all the articles we have for now.</p>
    </div>
</div>

<script>
    // 1. Serialize site.posts using Liquid
    const posts = [
        {% for post in site.guides %}
        {
            "title": {{ post.title | jsonify }},
            "excerpt": {{ post.excerpt | strip_html | strip_newlines | truncatewords: 30 | jsonify }},
            "url": {{ post.url | relative_url | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
    ];
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Load history from localStorage (works for guests too!)
        let likedGuides = JSON.parse(localStorage.getItem('mrmahesh_liked_guides') || '[]');
        let dislikedGuides = JSON.parse(localStorage.getItem('mrmahesh_disliked_guides') || '[]');

        // Filter out guides we've already interacted with
        let deck = posts.filter(p => !likedGuides.includes(p.url) && !dislikedGuides.includes(p.url));

        // 2a. Randomly shuffle the array
        const shuffleArray = (array) => {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        };

        if (deck.length === 0) {
            // Fallback mock data if running without Jekyll or empty posts
            deck = [
                { title: "Building Modern UIs", excerpt: "Learn how to build sleek user interfaces with Tailwind CSS.", url: "#" },
                { title: "The Future of AI", excerpt: "Discover what the future holds for artificial intelligence and automation.", url: "#" },
                { title: "Mastering JavaScript", excerpt: "Deep dive into JS concepts and become a better developer.", url: "#" }
            ];
        }

        shuffleArray(deck);
        let currentIndex = 0;

        const cardEl = document.getElementById('active-card');
        const titleEl = document.getElementById('card-title');
        const excerptEl = document.getElementById('card-excerpt');
        const linkEl = document.getElementById('card-link');
        const btnLeft = document.getElementById('btn-swipe-left');
        const btnRight = document.getElementById('btn-swipe-right');
        const endMessage = document.getElementById('end-message');

        // 2b. Render the top card
        const renderCard = () => {
            if (currentIndex >= deck.length) {
                cardEl.style.display = 'none';
                btnLeft.style.display = 'none';
                btnRight.style.display = 'none';
                endMessage.classList.remove('hidden');
                return;
            }
            const currentPost = deck[currentIndex];
            titleEl.textContent = currentPost.title;
            excerptEl.textContent = currentPost.excerpt;
            linkEl.href = currentPost.url;

            // Reset styles
            cardEl.className = 'swipe-card absolute inset-0 w-full h-full rounded-3xl shadow-2xl flex flex-col p-8 cursor-grab touch-none border border-gray-700/50';
            cardEl.style.transform = '';
            cardEl.style.backgroundColor = '#2c3e50';
            cardEl.classList.add('snap-back');
            setTimeout(() => cardEl.classList.remove('snap-back'), 400); // Remove class after animation
        };

        renderCard();

        // 2c & 2d. Swipe/Drag logic
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let currentY = 0;

        const SWIPE_THRESHOLD = 100; // pixels to trigger swipe

        const onDragStart = (e) => {
            if (currentIndex >= deck.length) return;
            // Ignore drag if clicking on the Read More link
            if (e.target === linkEl || linkEl.contains(e.target)) return;
            
            isDragging = true;
            cardEl.classList.add('dragging');
            cardEl.classList.remove('snap-back');
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            startX = clientX;
            startY = clientY;
        };

        const onDragMove = (e) => {
            if (!isDragging) return;
            if (e.type.includes('touch')) e.preventDefault(); 
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            currentX = clientX - startX;
            currentY = clientY - startY;

            // If dragging mostly down, don't rotate. Otherwise, rotate.
            const isMostlyDown = currentY > 50 && Math.abs(currentX) < 50;
            const rotate = isMostlyDown ? 0 : currentX * 0.05;
            cardEl.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;
        };

        const onDragEnd = () => {
            if (!isDragging) return;
            isDragging = false;
            cardEl.classList.remove('dragging');

            // Determine if swipe was down or horizontal
            if (currentY > SWIPE_THRESHOLD && Math.abs(currentX) < SWIPE_THRESHOLD) {
                handleSwipe('down');
            } else if (Math.abs(currentX) > SWIPE_THRESHOLD) {
                const direction = currentX > 0 ? 'right' : 'left';
                handleSwipe(direction);
            } else {
                cardEl.style.transform = '';
                cardEl.classList.add('snap-back');
            }
            currentX = 0;
            currentY = 0;
        };

        const handleSwipe = (direction) => {
            const currentPost = deck[currentIndex];

            if (direction === 'right') {
                cardEl.classList.add('swipe-right');
                if (currentPost) {
                    likedGuides.push(currentPost.url);
                    localStorage.setItem('mrmahesh_liked_guides', JSON.stringify(likedGuides));
                }
            } else if (direction === 'left') {
                cardEl.classList.add('swipe-left');
                if (currentPost) {
                    dislikedGuides.push(currentPost.url);
                    localStorage.setItem('mrmahesh_disliked_guides', JSON.stringify(dislikedGuides));
                }
            } else if (direction === 'down') {
                cardEl.classList.add('swipe-down');
                // Reset logic
                likedGuides = [];
                dislikedGuides = [];
                localStorage.setItem('mrmahesh_liked_guides', '[]');
                localStorage.setItem('mrmahesh_disliked_guides', '[]');
                deck = [...posts]; // reset deck
                shuffleArray(deck);
                currentIndex = -1; // so ++ makes it 0
            }

            setTimeout(() => {
                currentIndex++;
                renderCard();
            }, 300);
        };

        // Event Listeners
        cardEl.addEventListener('mousedown', onDragStart);
        window.addEventListener('mousemove', onDragMove, { passive: false });
        window.addEventListener('mouseup', onDragEnd);

        cardEl.addEventListener('touchstart', onDragStart, { passive: false });
        window.addEventListener('touchmove', onDragMove, { passive: false });
        window.addEventListener('touchend', onDragEnd);

        // Buttons
        btnLeft.addEventListener('click', () => {
            if (currentIndex < deck.length) handleSwipe('left');
        });
        btnRight.addEventListener('click', () => {
            if (currentIndex < deck.length) handleSwipe('right');
        });
    });
</script>
